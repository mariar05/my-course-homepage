<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Maria Radut</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header>
    <h1>Contact</h1>
    <p>Send me a message using the form below.</p>
  </header>

  <nav aria-label="Main navigation">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="contact.html" aria-current="page">Contact form</a></li>
    </ul>
  </nav>

  <main id="main-content">
    <section>
      <h2>Contact form</h2>

      <form aria-label="Contact form" action="#" method="post">
        <fieldset>
          <legend>Your details</legend>

          <div class="form-group">
            <label for="full-name">Full name</label>
            <input type="text" id="full-name" name="full-name" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="07xxxxxxxx" pattern="[0-9\s\-+]+" title="Digits, spaces, hyphens, or plus only">
          </div>
        </fieldset>

        <fieldset>
          <legend>Your message</legend>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <p id="message-help" class="helper-text">Please include key details so I can respond quickly.</p>
            <textarea id="message" name="message" aria-describedby="message-help" required></textarea>
          </div>
        </fieldset>

        <fieldset>
          <legend>How did you hear about us?</legend>

          <div class="radio-group">
            <div class="radio-item">
              <input type="radio" id="hear-friend" name="hear-about" value="friend" required>
              <label for="hear-friend">Friend</label>
            </div>

            <div class="radio-item">
              <input type="radio" id="hear-search" name="hear-about" value="search" required>
              <label for="hear-search">Search engine</label>
            </div>

            <div class="radio-item">
              <input type="radio" id="hear-social" name="hear-about" value="social" required>
              <label for="hear-social">Social media</label>
            </div>
          </div>
        </fieldset>

        <button type="submit">Send message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Maria Radut · Web Design</p>
  </footer>

</body>
</html>
